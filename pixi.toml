[workspace]
channels = ["knime/label/nightly", "knime", "conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]

[dependencies]
python = "*"
knime-extension = "*"
knime-python-base = "*"
knime-python-versions = "5.12.*"

[pypi-dependencies]
rdkit = "*"

[feature.build.dependencies]
python = "*"
knime-extension-bundling = "5.12.*"

[feature.debug.dependencies]
debugpy = "*"

[feature.build.tasks]
build = { args = [{ "arg" = "dest", "default" = "./local-update-site" }], cmd = "python ./.pixi/envs/build/bin/build_python_extension.py . {{ dest }} --update-sites-version 5.12"}

[environments]
build = {features = ["build"], no-default-feature = true}
debug = {features = ["debug"]}
